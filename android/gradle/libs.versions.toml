[versions]
uvcandroid = "1.0.13" # must match what RootEncoder extra-sources ships (it only exposes it at runtime)
zxing = "3.5.4"
agp = "9.4.1"
kotlin = "2.4.21"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
lifecycle = "2.10.0"
rootencoder = "2.8.1"
mwdat = "1.0.1"
okhttp = "5.5.1"
carApp = "1.7.0"
ktlint = "14.2.0"
junit = "4.13.2"
orgJson = "20260814"

[libraries]
uvcandroid = { group = "com.herohan", name = "UVCAndroid", version.ref = "uvcandroid" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version = "1.1.0" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
mwdat-core = { group = "com.meta.wearable", name = "mwdat-core", version.ref = "mwdat" }
mwdat-camera = { group = "com.meta.wearable", name = "mwdat-camera", version.ref = "mwdat" }
mwdat-mockdevice = { group = "com.meta.wearable", name = "mwdat-mockdevice", version.ref = "mwdat" }
rootencoder = { group = "com.github.pedroSG94.RootEncoder", name = "library", version.ref = "rootencoder" }
rootencoder-extra = { group = "com.github.pedroSG94.RootEncoder", name = "extra-sources", version.ref = "rootencoder" }
carapp = { group = "androidx.car.app", name = "app", version.ref = "carApp" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
# Bundled (not Play-services) models: blur must keep working offline mid-stream and without Play services.
mlkit-face = { group = "com.google.mlkit", name = "face-detection", version = "16.1.7" }
mlkit-text = { group = "com.google.mlkit", name = "text-recognition", version = "16.0.1" }
mlkit-barcode = { group = "com.google.mlkit", name = "barcode-scanning", version = "17.3.0" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
