# SwiftLint — MetaStream (Swift 6.0, XcodeGen, feature-based layout)
# Run: swiftlint lint --strict --baseline .swiftlint-baseline.json  (CI, build.yml's lint job). The baseline holds
# the violations that existed when CI started enforcing (2026-10-20); anything new fails, and so does an old one once
# its line is edited, so the backlog shrinks as code is touched. After fixing old ones, refresh it with
# --write-baseline .swiftlint-baseline.json (same command) so they can't come back.

only_rules:
  # Correctness / safety (audit: force unwraps, unredacted logs, swallowed errors)
  - force_cast
  - force_try
  - force_unwrapping
  - implicitly_unwrapped_optional
  - empty_count
  - empty_string
  - redundant_nil_coalescing
  - optional_enum_case_matching
  - discarded_notification_center_observer
  - unhandled_throwing_task     # Task { try ... } with nobody awaiting it: the error vanishes
  - weak_delegate
  - unowned_variable_capture    # [unowned self] crashes if self is gone; use weak
  - fatal_error_message

  # Complexity / size (audit: KISS + 300 code-line rule)
  - cyclomatic_complexity
  - function_body_length
  - type_body_length
  - file_length
  - nesting
  - function_parameter_count

  # Style / consistency (audit: CONTEXT.md naming, DRY)
  - identifier_name
  - type_name
  - colon
  - comma
  - trailing_comma
  - vertical_whitespace
  - trailing_whitespace
  - line_length
  - todo
  - private_over_fileprivate
  - sorted_imports
  - vertical_parameter_alignment_on_call

# 300 code-line rule (excl. blank/comments is approximated by file_length on
# total lines — keep total comfortably under ~400 so code stays <300).
file_length:
  warning: 400
  error: 600
  ignore_comment_only_lines: true

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 60
  error: 120

cyclomatic_complexity:
  warning: 10
  error: 18

function_parameter_count:
  warning: 5
  error: 8

nesting:
  type_level:
    warning: 2

line_length:
  warning: 140
  error: 180
  ignores_urls: true
  ignores_function_declarations: true

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y
    - e

excluded:
  - build
  - graphify-out
  - signing
