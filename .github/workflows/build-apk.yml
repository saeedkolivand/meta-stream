name: build-apk

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android 37 platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
      - name: Release keystore
        # Fails rather than falling back to a throwaway debug key, which couldn't update earlier installs.
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE" ] && [ -n "$KEYSTORE_PASSWORD" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets missing"; exit 1; }
          mkdir -p signing
          echo "$KEYSTORE" | base64 -d > signing/android-release.jks
          printf %s "$KEYSTORE_PASSWORD" > signing/android-keystore-password.txt
      - name: Build, test, lint
        # Same repo secrets as the iOS build; android/app/build.gradle.kts turns them into BuildConfig fields.
        env:
          KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          RESTREAM_CLIENT_ID: ${{ secrets.RESTREAM_CLIENT_ID }}
          RESTREAM_CLIENT_SECRET: ${{ secrets.RESTREAM_CLIENT_SECRET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }} # uploads R8 mappings; empty = no upload
        run: cd android && ./gradlew assembleRelease test lint ktlintCheck && bash loc.sh && bash ../scripts/folders.sh
      # Public repo: artifacts are downloadable by anyone, and the APK carries the Kick/Restream client secrets.
      # Encrypted like the IPA (build.yml); decrypt with signing/ipa-password.txt.
      - name: Encrypt APK
        env:
          IPA_PASSWORD: ${{ secrets.IPA_PASSWORD }}
        run: |
          for apk in android/app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$apk" -release.apk); abi=${abi#app-}
            openssl enc -aes-256-cbc -pbkdf2 -salt -in "$apk" -out "MetaStream-$abi.apk.enc" -pass env:IPA_PASSWORD
          done
      - uses: actions/upload-artifact@v7
        with:
          name: MetaStream-apk
          path: MetaStream-*.apk.enc
          retention-days: 1
