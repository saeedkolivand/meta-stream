name: build-apk

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android 37 platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
      - name: Build, test, lint
        run: cd android && ./gradlew assembleDebug test lint ktlintCheck && bash loc.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MetaStream-apk
          path: android/app/build/outputs/apk/debug/*.apk
