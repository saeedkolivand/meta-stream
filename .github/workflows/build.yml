name: build-ipa

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md", "android/**"]   # site/docs changes don't need an app build
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      # Development-signed build: the Meta SDK's Wi-Fi video link needs two entitlements
      # that only a paid Apple Developer team can grant (see README).
      - name: Install signing certificate and profile
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          LIVE_ACTIVITY_PROFILE_BASE64: ${{ secrets.LIVE_ACTIVITY_PROFILE_BASE64 }}
          SCREEN_PROFILE_BASE64: ${{ secrets.SCREEN_PROFILE_BASE64 }}
        run: |
          set -e
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # Profiles may be gzipped before base64: a secret holds at most 48 KB and a profile listing several
          # devices outgrows that. gunzip -f passes a plain (uncompressed) profile through unchanged.
          profile() { echo "$1" | base64 --decode | gunzip -cf > "$2"; }
          profile "$PROFILE_BASE64" "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d" && cp "$RUNNER_TEMP/profile.mobileprovision" "$d/$UUID.mobileprovision"
          done
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Installed profile '$NAME' ($UUID)"
          # Optional second profile for the Live Activity widget extension (com.saeedkolivand.metastream.LiveActivity).
          # Absent = app-only build, exactly as before. Present = LIVE_ACTIVITY=true makes xcodegen include
          # liveactivity.yml, so the extension is built, embedded and signed with its own profile.
          if [ -n "$LIVE_ACTIVITY_PROFILE_BASE64" ]; then
            profile "$LIVE_ACTIVITY_PROFILE_BASE64" "$RUNNER_TEMP/la.mobileprovision"
            security cms -D -i "$RUNNER_TEMP/la.mobileprovision" > "$RUNNER_TEMP/la.plist"
            LA_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/la.plist")
            LA_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/la.plist")
            for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$d" && cp "$RUNNER_TEMP/la.mobileprovision" "$d/$LA_UUID.mobileprovision"
            done
            echo "LIVE_ACTIVITY=true" >> "$GITHUB_ENV"
            echo "LIVE_ACTIVITY_PROFILE_NAME=$LA_NAME" >> "$GITHUB_ENV"
            echo "Installed Live Activity profile '$LA_NAME' ($LA_UUID)"
          else
            echo "LIVE_ACTIVITY=false" >> "$GITHUB_ENV"
            echo "No Live Activity profile: building the app without the widget extension"
          fi
          # Optional third profile for the screen-share broadcast extension (com.saeedkolivand.metastream.Screen);
          # absent = SCREEN=false, the app builds without it and hides the Screen source.
          if [ -n "$SCREEN_PROFILE_BASE64" ]; then
            profile "$SCREEN_PROFILE_BASE64" "$RUNNER_TEMP/screen.mobileprovision"
            security cms -D -i "$RUNNER_TEMP/screen.mobileprovision" > "$RUNNER_TEMP/screen.plist"
            SC_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/screen.plist")
            SC_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/screen.plist")
            for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$d" && cp "$RUNNER_TEMP/screen.mobileprovision" "$d/$SC_UUID.mobileprovision"
            done
            echo "SCREEN=true" >> "$GITHUB_ENV"
            echo "SCREEN_PROFILE_NAME=$SC_NAME" >> "$GITHUB_ENV"
            echo "Installed Screen profile '$SC_NAME' ($SC_UUID)"
          else
            echo "SCREEN=false" >> "$GITHUB_ENV"
            echo "No Screen profile: building the app without the broadcast extension"
          fi

      # After the signing step: it decides LIVE_ACTIVITY, which liveactivity.yml's include is gated on.
      - name: Generate Xcode project
        run: xcodegen generate

      # The demo() self-checks are `#if DEBUG`, and the archive below is Release, so without this
      # step they are never even compiled. This builds Debug for device so they are type-checked
      # every run and cannot silently rot. It does NOT execute the asserts: the app traps on
      # launch in a simulator (the Meta SDK), so a hosted test target was not worth the chase.
      - name: Compile the DEBUG self-checks
        run: |
          xcodebuild build             -project MetaStream.xcodeproj             -scheme MetaStream             -configuration Debug             -destination 'generic/platform=iOS'             -skipPackagePluginValidation -skipMacroValidation             CODE_SIGNING_ALLOWED=NO

      - name: Archive (signed)
        run: |
          xcodebuild archive \
            -project MetaStream.xcodeproj \
            -scheme MetaStream \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MetaStream.xcarchive \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Development" \
            DEVELOPMENT_TEAM="${{ secrets.TEAM_ID }}" \
            APP_PROFILE_NAME="$PROFILE_NAME" LIVE_ACTIVITY_PROFILE_NAME="$LIVE_ACTIVITY_PROFILE_NAME" SCREEN_PROFILE_NAME="$SCREEN_PROFILE_NAME" \
            META_APP_ID="${{ secrets.META_APP_ID }}" CLIENT_TOKEN="${{ secrets.CLIENT_TOKEN }}" TEAM_ID="${{ secrets.TEAM_ID }}" \
            KICK_CLIENT_ID="${{ secrets.KICK_CLIENT_ID }}" KICK_CLIENT_SECRET="${{ secrets.KICK_CLIENT_SECRET }}" TWITCH_CLIENT_ID="${{ secrets.TWITCH_CLIENT_ID }}" \
            RESTREAM_CLIENT_ID="${{ secrets.RESTREAM_CLIENT_ID }}" RESTREAM_CLIENT_SECRET="${{ secrets.RESTREAM_CLIENT_SECRET }}" YOUTUBE_CLIENT_ID="${{ secrets.YOUTUBE_CLIENT_ID }}"

      - name: Package IPA
        run: |
          codesign -d --entitlements - build/MetaStream.xcarchive/Products/Applications/MetaStream.app
          mkdir -p build/Payload && cp -R build/MetaStream.xcarchive/Products/Applications/MetaStream.app build/Payload/ && (cd build && zip -qry MetaStream.ipa Payload)

      # Public repo: anyone with a GitHub account can download artifacts, and the IPA embeds OAuth client
      # secrets. Encrypt it; decrypt locally with signing/ipa-password.txt (see README).
      - name: Encrypt IPA
        env:
          IPA_PASSWORD: ${{ secrets.IPA_PASSWORD }}
        run: openssl enc -aes-256-cbc -pbkdf2 -salt -in build/MetaStream.ipa -out build/MetaStream.ipa.enc -pass env:IPA_PASSWORD

      # Without these, a crash report from the device shows "MetaStream" with no symbols at all --
      # which is exactly what happened chasing the stop-then-go-live crash. Encrypted like the IPA,
      # since they are only useful alongside it.
      - name: Package dSYMs
        env:
          IPA_PASSWORD: ${{ secrets.IPA_PASSWORD }}
        run: |
          (cd build/MetaStream.xcarchive && zip -qry "$GITHUB_WORKSPACE/build/MetaStream.dSYMs.zip" dSYMs)
          openssl enc -aes-256-cbc -pbkdf2 -salt -in build/MetaStream.dSYMs.zip             -out build/MetaStream.dSYMs.zip.enc -pass env:IPA_PASSWORD

      - uses: actions/upload-artifact@v7
        with:
          name: MetaStream-dsyms
          path: build/MetaStream.dSYMs.zip.enc
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: MetaStream-ipa
          path: build/MetaStream.ipa.enc
          retention-days: 1
