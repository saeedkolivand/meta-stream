name: MetaStream
# Live Activity widget extension: needs its own App ID + profile, so it is opt-in. CI sets LIVE_ACTIVITY=true
# only when that profile is installed. Unset/false = app-only build (XcodeGen reads "${...}" as a bool; the
# unexpanded literal is false). Included specs merge FIRST, arrays append (see liveactivity.yml).
include:
  - path: liveactivity.yml
    enable: ${LIVE_ACTIVITY}
  - path: screen.yml   # same for the screen-share broadcast extension, gated on SCREEN
    enable: ${SCREEN}
options:
  bundleIdPrefix: com.saeedkolivand
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.4"
packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 0.9.0
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift
    from: 2.1.0
targets:
  MetaStream:
    type: application
    platform: iOS
    sources: [MetaStream]
    # ponytail: hand-written Info.plist (MWDAT keys, URL scheme, etc.) — INFOPLIST_FILE
    # instead of the `info:` key, since `info.path` makes XcodeGen regenerate/overwrite
    # the plist from `info.properties` on every `xcodegen generate`.
    settings:
      base:
        INFOPLIST_FILE: MetaStream/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.saeedkolivand.metastream
        ARCHS: arm64
        SWIFT_VERSION: "6.0"   # Swift 6 mode: complete data-race checking, as errors (SWIFT_STRICT_CONCURRENCY is moot)
        # Every warning fails the build; deprecations stay warnings (an SDK/HaishinKit update can deprecate with no
        # replacement, e.g. Screen.isGPURendererEnabled). Order matters: -Wwarning has to come after.
        OTHER_SWIFT_FLAGS: "$(inherited) -warnings-as-errors -Wwarning DeprecatedDeclaration"
        TARGETED_DEVICE_FAMILY: "1,2"   # iPad too: USB-C iPads take UVC cameras (DJI webcam mode)
        META_APP_ID: ""
        CLIENT_TOKEN: ""
        TEAM_ID: ""
        KICK_CLIENT_ID: ""
        KICK_CLIENT_SECRET: ""
        TWITCH_CLIENT_ID: ""
        RESTREAM_CLIENT_ID: ""
        RESTREAM_CLIENT_SECRET: ""
        YOUTUBE_CLIENT_ID: ""
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: $(APP_PROFILE_NAME)   # per-target, passed by CI (a command-line specifier would hit the extension too)
        CODE_SIGN_ENTITLEMENTS: MetaStream/MetaStream.entitlements   # Wi-Fi entitlements the Meta SDK needs for video
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
      - package: HaishinKit
        product: SRTHaishinKit
  MetaStreamTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MetaStreamTests]
    dependencies:
      - target: MetaStream

